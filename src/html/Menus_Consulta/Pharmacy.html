<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Farmacia - CDI Uchire</title>
    <link href="../../lib/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../../css/dashboards.css">
    <script src="../../lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../../css/Menus_Consulta/Patient_records.css">
    <script defer src="../../Operadores/Operador_Consulta/js/Pharmacy.js"></script>
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="fas fa-pills"></i>
            </div>
            <h5 class="fw-bold mb-0">CDI UCHIRE</h5>
            <small class="text-muted text-uppercase tracking-wider" style="font-size: 0.65rem;">Módulo Operativo</small>
        </div>

        <nav class="menu-list">
            <div class="menu-item"><a href="dashboard_cosn.html" class="menu-link"><i
                        class="fas fa-th-large"></i><span>Panel Principal</span></a></div>
            <div class="menu-item"><a href="consultation.html" class="menu-link"><i
                        class="fas fa-user-md"></i><span>Consultas</span></a></div>
            <div class="menu-item"><a href="Patient_records.html" class="menu-link"><i
                        class="fas fa-id-card"></i><span>Pacientes</span></a></div>
            <div class="menu-item"><a href="Pharmacy.html" class="menu-link active"><i
                        class="fas fa-pills"></i><span>Farmacia</span></a></div>
            <div class="menu-item"><a href="Reports.html" class="menu-link"><i
                        class="fas fa-chart-line"></i><span>Reportes</span></a></div>
            <div class="mt-5 pt-4 border-top">
                <a href="../logout.html" class="menu-link text-danger"><i class="fas fa-sign-out-alt"></i><span>Cerrar
                        Sesión</span></a>
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-5 animate-fade">
            <div>
                <h3 class="fw-bold mb-1">Inventario de Medicamentos</h3>
                <p class="text-muted mb-0">Gestión de stock e insumos médicos del CDI.</p>
            </div>
            <div class="d-flex align-items-center gap-3">
                <div class="nav-user-pill">
                    <span class="small fw-semibold text-secondary" id="current-date"></span>
                    <div class="vr mx-2"></div>
                    <img src="" alt="Avatar" class="rounded-circle" width="32" id="user-avatar">
                    <span class="small fw-bold" id="user-name">Usuario</span>
                </div>
            </div>
        </header>

        <!-- Search and Filter -->
        <div class="glass-card mb-4 animate-fade">
            <div class="row align-items-center">
                <div class="col-md-12">
                    <div class="search-container flex-grow-1">
                        <i class="fas fa-search me-2 text-muted"></i>
                        <input type="text" id="search-input" class="form-control border-0 bg-transparent"
                            placeholder="Buscar por nombre comercial o principio activo...">
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-card p-0 overflow-hidden animate-fade">
            <div class="table-responsive">
                <table class="premium-table mb-0">
                    <thead>
                        <tr>
                            <th class="ps-4 cursor-pointer sortable" data-sort="name">Nombre Comercial <i
                                    class="fas fa-sort ms-1 small text-muted"></i></th>
                            <th class="cursor-pointer sortable" data-sort="active">Principio Activo <i
                                    class="fas fa-sort ms-1 small text-muted"></i></th>
                            <th>Concentración</th>
                            <th>Presentación</th>
                            <th class="cursor-pointer sortable" data-sort="stock">Cantidad <i
                                    class="fas fa-sort ms-1 small text-muted"></i></th>
                            <th class="text-end pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-tbody">
                        <!-- JS Loaded -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Movement Modal -->
    <div class="modal fade glass-modal" id="movementModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="fw-bold">Registrar Movimiento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="movement-form">
                    <div class="modal-body py-4">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Medicamento</label>
                                <select id="mv-item" class="form-select" required>
                                    <option value="" selected disabled>Seleccionar...</option>
                                    <!-- Options via JS -->
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tipo</label>
                                <select id="mv-tipo" class="form-select" required>
                                    <option value="Entrada">Entrada (Ingreso)</option>
                                    <option value="Salida">Salida (Consumo)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Cantidad</label>
                                <input type="number" id="mv-cantidad" class="form-control" value="1" min="1" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-light rounded-pill px-4"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Registrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-white bg-dark border-0 rounded-4 shadow-lg"
            role="alert">
            <div class="d-flex">
                <div class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

</body>

</html>
