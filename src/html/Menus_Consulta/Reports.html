<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - CDI Uchire</title>
    <link href="../../lib/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../../css/dashboards.css">
    <script src="../../lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../lib/chartjs/chart.umd.js"></script>

    <!-- Local Report Libraries -->
    <script>
        if (typeof module === 'object') { window._temp_module = module; module = undefined; }
    </script>
    <script src="../../lib/vendor/jspdf.umd.min.js"></script>
    <script src="../../lib/vendor/jspdf.plugin.autotable.min.js"></script>
    <script src="../../lib/vendor/xlsx.full.min.js"></script>
    <script>
        if (window._temp_module) { module = window._temp_module; delete window._temp_module; }
    </script>
    <script src="../../js/utils/reports_utils.js"></script>
    <link rel="stylesheet" href="../../css/Menus_Consulta/Reports.css">
    <script defer src="../../Operadores/Operador_Consulta/js/Reports.js"></script>
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="fas fa-chart-line"></i>
            </div>
            <h5 class="fw-bold mb-0">CDI UCHIRE</h5>
            <small class="text-muted text-uppercase tracking-wider" style="font-size: 0.65rem;">Módulo Operativo</small>
        </div>

        <nav class="menu-list">
            <div class="menu-item"><a href="dashboard_cosn.html" class="menu-link"><i
                        class="fas fa-th-large"></i><span>Panel Principal</span></a></div>
            <div class="menu-item"><a href="consultation.html" class="menu-link"><i
                        class="fas fa-user-md"></i><span>Consultas</span></a></div>
            <div class="menu-item"><a href="Patient_records.html" class="menu-link"><i
                        class="fas fa-id-card"></i><span>Pacientes</span></a></div>
            <div class="menu-item"><a href="Pharmacy.html" class="menu-link"><i
                        class="fas fa-pills"></i><span>Farmacia</span></a></div>
            <div class="menu-item"><a href="Reports.html" class="menu-link active"><i
                        class="fas fa-chart-line"></i><span>Reportes</span></a></div>
            <div class="mt-5 pt-4 border-top">
                <a href="../logout.html" class="menu-link text-danger"><i class="fas fa-sign-out-alt"></i><span>Cerrar
                        Sesión</span></a>
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-5 animate-fade">
            <div>
                <h3 class="fw-bold mb-1">Módulo de Reportes Operativos</h3>
                <p class="text-muted mb-0">Generación de documentos y análisis de datos estadísticos.</p>
            </div>
            <div class="nav-user-pill">
                <span class="small fw-semibold text-secondary" id="current-date"></span>
                <div class="vr mx-2"></div>
                <img src="" alt="User" class="rounded-circle" width="32" id="user-avatar">
                <span class="small fw-bold" id="user-name">Usuario</span>
            </div>
        </header>

        <!-- New Custom Report Section -->
        <div class="glass-card mb-5 animate-fade">
            <h5 class="fw-bold mb-4"><i class="fas fa-filter me-2 text-primary"></i>Personalizar Reporte</h5>
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-bold">Tipo de Datos</label>
                    <select id="custom-rep-type" class="form-select rounded-pill">
                        <option value="consultas">Consultas Médicas</option>
                        <option value="pacientes">Registro de Pacientes</option>
                        <option value="inventario">Inventario Farmacia</option>
                        <option value="movimientos">Movimientos Farmacia</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold">Desde</label>
                    <input type="date" id="custom-rep-start" class="form-control rounded-pill">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold">Hasta</label>
                    <input type="date" id="custom-rep-end" class="form-control rounded-pill">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold">Formato</label>
                    <div class="d-flex gap-2">
                        <input type="radio" class="btn-check" name="rep-format" id="fmt-pdf" value="pdf" checked>
                        <label class="btn btn-outline-danger rounded-pill flex-grow-1" for="fmt-pdf"><i
                                class="fas fa-file-pdf me-2"></i>PDF</label>

                        <input type="radio" class="btn-check" name="rep-format" id="fmt-excel" value="excel">
                        <label class="btn btn-outline-success rounded-pill flex-grow-1" for="fmt-excel"><i
                                class="fas fa-file-excel me-2"></i>Excel</label>
                    </div>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary rounded-pill w-100 fw-bold" id="btn-generate-custom">
                        <i class="fas fa-download me-2"></i>Generar
                    </button>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-5 animate-fade">
            <div class="col-md-3">
                <div class="glass-card text-center p-4 h-100">
                    <div class="stat-icon bg-primary bg-opacity-10 text-primary mx-auto mb-3">
                        <i class="fas fa-user-md fa-lg"></i>
                    </div>
                    <h6>Consultas</h6>
                    <button class="btn btn-link btn-sm text-decoration-none p-0 mt-2"
                        onclick="generateQuick('consultas')">Descarga rápida</button>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card text-center p-4 h-100">
                    <div class="stat-icon bg-success bg-opacity-10 text-success mx-auto mb-3">
                        <i class="fas fa-id-card fa-lg"></i>
                    </div>
                    <h6>Pacientes</h6>
                    <button class="btn btn-link btn-sm text-decoration-none p-0 mt-2"
                        onclick="generateQuick('pacientes')">Descarga rápida</button>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card text-center p-4 h-100">
                    <div class="stat-icon bg-info bg-opacity-10 text-info mx-auto mb-3">
                        <i class="fas fa-pills fa-lg"></i>
                    </div>
                    <h6>Inventario</h6>
                    <button class="btn btn-link btn-sm text-decoration-none p-0 mt-2"
                        onclick="generateQuick('inventario')">Descarga rápida</button>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card text-center p-4 h-100">
                    <div class="stat-icon bg-warning bg-opacity-10 text-warning mx-auto mb-3">
                        <i class="fas fa-exchange-alt fa-lg"></i>
                    </div>
                    <h6>Movimientos</h6>
                    <button class="btn btn-link btn-sm text-decoration-none p-0 mt-2"
                        onclick="generateQuick('movimientos')">Descarga rápida</button>
                </div>
            </div>
        </div>

        <div class="glass-card p-4 animate-fade" style="animation-delay: 0.2s;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-bold mb-0"><i class="fas fa-chart-area me-2 text-primary"></i>Tendencia de Atenciones</h5>
                <div class="badge bg-light text-dark border rounded-pill">Últimos 7 días</div>
            </div>
            <div class="chart-container" style="height: 350px;">
                <canvas id="trendsChart"></canvas>
            </div>
        </div>
    </main>

    <!-- Toast Notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-white bg-dark border-0 rounded-4 shadow-lg"
            role="alert">
            <div class="d-flex">
                <div class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

</body>

</html>
