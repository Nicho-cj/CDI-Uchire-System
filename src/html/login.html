<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - CDI Uchire</title>
    <link href="../lib/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../lib/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <div class="login-card animate-in">
        <div class="card-header">
            <div class="logo-circle">
                <i class="fas fa-hospital-user"></i>
            </div>
            <h3 class="system-title">CDI Uchire</h3>
            <div class="system-subtitle">Sistema Integral de Salud</div>
        </div>

        <div class="card-body pt-0">
            <div id="error-alert" class="alert alert-danger py-2 small rounded-3 shadow-sm mb-3" style="display:none;">
                <i class="fas fa-exclamation-circle me-1"></i>
                <span id="error-message"></span>
            </div>

            <form method="POST" id="loginForm">

                <div class="mb-3 input-group">
                    <span class="input-group-text"><i class="fas fa-user-md"></i></span>
                    <input type="text" class="form-control" id="username" name="username"
                        placeholder="Usuario Institucional" required autocomplete="off">
                </div>

                <div class="mb-4 input-group">
                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Contraseña de Acceso" required>
                    <button type="button" class="btn btn-outline-secondary border-start-0" id="togglePassword"
                        style="border-radius: 0 10px 10px 0; border-left: none;">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt me-2"></i>Ingresar al Sistema
                    </button>
                </div>

                <div class="d-grid gap-2 mt-3">
                    <a href="Bd_creator.html" class="btn btn-outline-secondary btn-sm" style="font-size: 0.85rem;">
                        <i class="fas fa-cogs me-1"></i> Configuración / Instalación
                    </a>
                </div>
            </form>

            <div class="footer-text">
                <i class="fas fa-shield-alt me-1"></i> Acceso Seguro MPPS<br>
                &copy; 2026 Ministerio del Poder Popular para la Salud
            </div>
        </div>
    </div>

    <script src="../lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/login.js"></script>
</body>

</html>
